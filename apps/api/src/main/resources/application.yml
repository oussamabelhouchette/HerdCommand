server:
  port: ${API_PORT:8080}

spring:
  application:
    name: herdcommand-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/herdcommand}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:admin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:9090/realms/herdcommand}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /swagger-ui.html

herdcommand:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  keycloak:
    admin:
      base-url: ${KEYCLOAK_ADMIN_BASE_URL:http://localhost:9090}
      realm: ${KEYCLOAK_ADMIN_REALM:herdcommand}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:herdcommand-admin}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      login-redirect-uri: ${KEYCLOAK_INVITE_REDIRECT_URI:http://localhost:3000/login}
      public-client-id: ${KEYCLOAK_INVITE_CLIENT_ID:herdcommand}
      action-lifespan-seconds: ${KEYCLOAK_INVITE_LIFESPAN_SECONDS:43200}
