<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HerdCommand login preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./resources/css/login.css" />
  </head>
  <body class="hc-body">
    <div class="hc-shell">
      <aside class="hc-visual" aria-hidden="true">
        <img class="hc-visual-img" src="./resources/img/login-visual.svg" alt="" />
        <div class="hc-visual-copy">
          <p class="hc-visual-kicker">هيرد كوماند</p>
          <p class="hc-visual-line">منصة ذكية لإدارة القطيع والعمليات الميدانية</p>
        </div>
      </aside>
      <div class="hc-page">
      <header class="hc-top">
        <nav class="hc-lang" aria-label="Language">
          <a class="hc-lang-item" href="./preview-en.html">EN</a>
          <a class="hc-lang-item is-active" href="./preview.html">العربية</a>
        </nav>
        <p class="hc-top-name">هيرد كوماند</p>
      </header>

      <div class="hc-brand">
        <div class="hc-mark" aria-hidden="true"><span class="hc-mark-inner"></span></div>
        <p class="hc-wordmark">هيرد كوماند</p>
      </div>

      <main class="hc-card">
        <div class="hc-card-head">
          <h1 class="hc-title">تسجيل الدخول</h1>
          <p class="hc-subtitle">أدخل بياناتك لإدارة قطيعك بذكاء</p>
        </div>

        <form class="hc-form" action="#" method="post" onsubmit="return false">
          <div class="pf-v5-c-form__group">
            <div class="hc-label-row">
              <label class="hc-label" for="username">البريد الإلكتروني أو رقم الجوال</label>
            </div>
            <div class="hc-input-wrap">
              <input id="username" type="text" placeholder="example@farm.com" autocomplete="username" />
              <svg class="hc-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="8" r="3.2" />
                <path d="M5 19c1.6-3 4.1-4.5 7-4.5S17.4 16 19 19" />
              </svg>
            </div>
          </div>

          <div class="pf-v5-c-form__group">
            <div class="hc-label-row">
              <label class="hc-label" for="password">كلمة المرور</label>
              <a class="hc-forgot" href="#">نسيت كلمة المرور؟</a>
            </div>
            <div class="hc-input-wrap">
              <input id="password" type="password" value="••••••••" autocomplete="current-password" />
              <svg class="hc-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M8 11V8a4 4 0 0 1 8 0v3" />
              </svg>
            </div>
          </div>

          <button class="hc-submit" type="submit">تسجيل الدخول</button>
        </form>

        <p class="hc-or">أو</p>
        <div class="hc-alt">
          <span class="hc-alt-btn">نفاذ</span>
          <span class="hc-alt-btn">Google</span>
        </div>
        <p class="hc-info">ليس لديك حساب؟ <strong>إنشاء حساب جديد</strong></p>
      </main>

      <footer class="hc-footer">
        <p class="hc-legal">© 2024 هيرد كوماند للحلول الزراعية. جميع الحقوق محفوظة</p>
      </footer>
    </div>
    </div>
  </body>
</html>
