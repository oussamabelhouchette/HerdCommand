name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @herdcommand/tokens test
      - run: pnpm --filter @herdcommand/web lint
      - run: pnpm --filter @herdcommand/web test
      - run: pnpm --filter @herdcommand/web build
        env:
          AUTH_SECRET: ci-secret-ci-secret-ci-secret-12
          AUTH_TRUST_HOST: true
          AUTH_KEYCLOAK_ID: herdcommand
          AUTH_KEYCLOAK_SECRET: web-dev-secret
          AUTH_KEYCLOAK_ISSUER: http://localhost:9090/realms/herdcommand
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      - run: pnpm --filter @herdcommand/mobile test

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn -f apps/api/pom.xml --batch-mode test
